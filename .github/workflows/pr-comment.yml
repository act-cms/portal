name: PR Lesson Check Comment

# Posts the pass/fail summary produced by pr-check.yml as a PR comment.
#
# Why this is a second workflow: on `pull_request`, GitHub forces the fork's
# GITHUB_TOKEN to read-only no matter what `permissions:` declares, so the
# check itself cannot comment on a fork PR (HTTP 403). A `workflow_run`
# workflow runs in the base-repo context and does get a writable token.
#
# The safety property that makes this work: `workflow_run` always uses the copy
# of this file on the default branch, and this job never checks out PR content
# — it only downloads an artifact and posts its text. So the fork's scripts and
# templates never execute in a job holding a write-scoped token. (Switching
# pr-check.yml itself to `pull_request_target` would hand that token to a job
# that runs the fork's scripts/ and templates/ — a repo-takeover vector. Don't.)
#
# Everything in the artifact is untrusted data: it is written by the job that
# ran the PR author's code. It is only ever posted as a comment body, and the
# PR number it claims is verified against the run's head SHA before use.

on:
  workflow_run:
    workflows: ["PR Lesson Check"]
    types: [completed]

permissions:
  contents: read
  actions: read         # to download the check run's artifact
  pull-requests: write  # to post/update the summary comment

# Serialize per branch so two runs finishing at once can't both conclude that
# no comment exists yet and each create one.
concurrency:
  group: pr-comment-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  comment:
    runs-on: ubuntu-latest
    # A cancelled run (superseded by a newer push) uploaded no artifact.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'failure')

    steps:
      - name: Download the comment artifact
        id: download
        continue-on-error: true  # a run that died before uploading is not an error here
        uses: actions/download-artifact@v4
        with:
          name: pr-check-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post or update the PR comment
        if: steps.download.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;

            // Untrusted content — post as-is, never interpret. Cap it well
            // under GitHub's 65536-character comment limit so a pathological
            // build log can't make every comment fail to post.
            const LIMIT = 60000;
            let body = fs.readFileSync('pr_comment.md', 'utf8');
            if (body.length > LIMIT) {
              body = body.slice(0, LIMIT) +
                '\n\n_…truncated. See the full log in the **Actions** tab._\n';
            }

            // Resolve the PR from trusted event data first. `pull_requests` is
            // empty for fork PRs, so fall back to the commit→PR lookup, and
            // only then to the number the check job recorded — accepted just
            // when that PR's head really is the commit this run tested.
            let prNumber = run.pull_requests?.[0]?.number;

            if (!prNumber) {
              const { data: prs } =
                await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner, repo, commit_sha: run.head_sha,
                });
              prNumber = prs.find(p => p.head.sha === run.head_sha)?.number;
            }

            if (!prNumber && fs.existsSync('pr_number.txt')) {
              const claimed = Number(fs.readFileSync('pr_number.txt', 'utf8').trim());
              if (Number.isInteger(claimed) && claimed > 0) {
                const { data: pr } =
                  await github.rest.pulls.get({ owner, repo, pull_number: claimed });
                if (pr.head.sha === run.head_sha) {
                  prNumber = claimed;
                } else {
                  core.warning(`Ignoring claimed PR #${claimed}: its head is ` +
                               `${pr.head.sha}, not ${run.head_sha}.`);
                }
              }
            }

            if (!prNumber) {
              core.setFailed(`No pull request found for ${run.head_sha}; comment not posted.`);
              return;
            }

            const marker = '<!-- act-cms-lesson-check -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            // Only ever update our own comment — a marker in someone else's
            // comment must not redirect the check summary.
            const existing = comments.find(
              c => c.user?.type === 'Bot' && c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber, body,
              });
            }
