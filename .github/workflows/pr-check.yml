name: PR Lesson Check

# Validates lesson submissions on pull requests (branch-based, no fork required)
# and renders the portal pages, then posts a friendly pass/fail summary as a PR
# comment. This does NOT deploy — deployment stays in build-site.yml on main.

on:
  pull_request:
    branches: [ main ]
    # Run when a lesson YAML is submitted, or when the build infrastructure
    # that renders/validates them changes. A submission is almost always a
    # single lessons/*.yml file.
    paths:
      - '**/*.yml'
      - '**/*.yaml'
      - 'templates/**'
      - 'scripts/**'
      - 'theme.css'
      - 'index.html'

permissions:
  contents: read
  pull-requests: write  # needed to post/update the summary comment

# If an author pushes several times quickly, only check the latest commit.
concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need history to diff the PR against its base

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jinja2 requests

      - name: Validate lessons and render portal
        id: build
        run: |
          set -o pipefail
          python scripts/build_site.py 2>&1 | tee build.log

      # Confirm every YAML touched by this PR is a lesson living in lessons/.
      # A .yml added anywhere else is almost always a misplaced submission;
      # paths.yml (learning paths) and template.yaml (the reference) are the
      # only YAML files that legitimately live at the repo root.
      - name: Check submitted YAML is in lessons/
        id: location
        if: always()
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          : > changed_lessons.txt
          while IFS= read -r f; do
            case "$f" in
              *.yml|*.yaml) ;;
              *) continue ;;
            esac
            if [ "$f" = "paths.yml" ] || [ "$f" = "template.yaml" ]; then
              continue
            fi
            case "$f" in
              lessons/*.yml|lessons/*.yaml)
                printf '%s\n' "$f" >> changed_lessons.txt
                ;;
              *)
                echo "Error: '$f' is a YAML file outside the lessons/ folder. Lesson submissions must live in lessons/<your-module>.yml." | tee -a build.log
                echo "location_failed=true" >> "$GITHUB_OUTPUT"
                ;;
            esac
          done < <(git diff --name-only --diff-filter=d "$base"...HEAD)

      # Verify links resolve and no template placeholders were left in. Only the
      # lesson files this PR changed are checked, to avoid network-checking (and
      # potentially failing on) unrelated lessons.
      - name: Check links and placeholders
        id: linkcheck
        if: always()
        run: |
          set -o pipefail
          if [ -s changed_lessons.txt ]; then
            xargs -a changed_lessons.txt python scripts/check_links.py 2>&1 | tee -a build.log
          else
            echo "check_links: no changed lesson files to check." | tee -a build.log
          fi

      - name: Determine overall outcome
        id: outcome
        if: always()
        run: |
          result=success
          if [ "${{ steps.build.outcome }}" = "failure" ]; then result=failure; fi
          if [ "${{ steps.linkcheck.outcome }}" = "failure" ]; then result=failure; fi
          if [ "${{ steps.location.outputs.location_failed }}" = "true" ]; then result=failure; fi
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Format PR comment
        if: always()
        run: |
          python scripts/format_pr_comment.py "${{ steps.outcome.outputs.result }}" build.log pr_comment.md

      - name: Post or update PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('pr_comment.md', 'utf8');
            const marker = '<!-- act-cms-lesson-check -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

      - name: Fail the check if anything failed
        if: steps.outcome.outputs.result == 'failure'
        run: exit 1
