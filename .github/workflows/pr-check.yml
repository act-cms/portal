name: PR Lesson Check

# Validates lesson submissions on pull requests (branch-based, no fork required)
# and renders the portal pages, then posts a friendly pass/fail summary as a PR
# comment. This does NOT deploy — deployment stays in build-site.yml on main.

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write  # needed to post/update the summary comment

# If an author pushes several times quickly, only check the latest commit.
concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jinja2

      - name: Validate lessons and render portal
        id: build
        run: |
          set -o pipefail
          python scripts/build_site.py 2>&1 | tee build.log

      - name: Format PR comment
        if: always()
        run: |
          python scripts/format_pr_comment.py "${{ steps.build.outcome }}" build.log pr_comment.md

      - name: Post or update PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('pr_comment.md', 'utf8');
            const marker = '<!-- act-cms-lesson-check -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

      - name: Fail the check if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
