name: PR Lesson Check

# Validates lesson submissions on pull requests (branch PRs and forks) and
# renders the portal pages. This does NOT deploy — deployment stays in
# build-site.yml on main.
#
# This job checks out and runs the PR author's code (scripts/, templates/), so
# it deliberately holds a read-only GITHUB_TOKEN and touches no secrets. That
# means it cannot post its own summary comment: on `pull_request`, GitHub
# forces the fork token to read-only regardless of the declared permissions
# block, so the comment API returns HTTP 403. Instead the rendered comment is
# uploaded as an artifact and posted by pr-comment.yml, which runs on
# `workflow_run` in the base-repo context with a writable token and never
# checks out PR code.

on:
  pull_request:
    branches: [ main ]
    # Run when a lesson YAML is submitted, or when the build infrastructure
    # that renders/validates them changes. A submission is almost always a
    # single lessons/*.yml file.
    paths:
      - '**/*.yml'
      - '**/*.yaml'
      - 'templates/**'
      - 'scripts/**'
      - 'theme.css'
      - 'index.html'

permissions:
  contents: read  # deliberately read-only — this job runs untrusted PR code

# If an author pushes several times quickly, only check the latest commit.
concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need history to diff the PR against its base

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jinja2 requests

      - name: Validate lessons and render portal
        id: build
        run: |
          set -o pipefail
          python scripts/build_site.py 2>&1 | tee build.log

      # Confirm every YAML touched by this PR is a lesson living in lessons/ AND
      # named exactly <slug>.yml. build_site.py discovers lessons with
      # glob('*.yml'), so a .yaml (or a stray double extension like .yml.yaml)
      # is silently skipped — it would never be validated or deployed yet the
      # build still passes. We reject those here. paths.yml (learning paths) and
      # template.yaml (the reference) are the only YAML files that legitimately
      # live at the repo root, and .github/ is CI config rather than lesson
      # content — without that exemption every workflow edit fails this check
      # with "move it into lessons/", because the paths filter above matches
      # '**/*.yml'.
      #
      # We diff the PR head SHA against base (base...head), NOT ...HEAD. On a
      # pull_request event, actions/checkout resolves HEAD to the *merge* ref
      # (head merged into current main), so ...HEAD would also surface every
      # change main made since the branch forked — misattributing main's own
      # commits (e.g. edits to this workflow) to the PR. Diffing the pure head
      # SHA yields exactly the author's changes, matching GitHub's "Files
      # changed" tab, even when the branch is behind main.
      - name: Check submitted YAML is a lessons/*.yml file
        id: location
        if: always()
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          : > changed_lessons.txt
          while IFS= read -r f; do
            case "$f" in
              *.yml|*.yaml) ;;
              *) continue ;;
            esac
            # Repo infrastructure, not a lesson submission.
            case "$f" in
              .github/*|paths.yml|template.yaml) continue ;;
            esac
            case "$f" in
              lessons/*.yml)
                printf '%s\n' "$f" >> changed_lessons.txt
                ;;
              lessons/*)
                echo "Error: '$f' must use the '.yml' extension — the build only processes lessons/*.yml, so this file would be silently ignored and never appear on the site. Rename it to lessons/<your-module>.yml." | tee -a build.log
                echo "location_failed=true" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "Error: '$f' is a YAML file outside the lessons/ folder. Lesson submissions must live in lessons/<your-module>.yml." | tee -a build.log
                echo "location_failed=true" >> "$GITHUB_OUTPUT"
                ;;
            esac
          done < <(git diff --name-only --diff-filter=d "$base...$head")

      # Verify links resolve and no template placeholders were left in. Only the
      # lesson files this PR changed are checked, to avoid network-checking (and
      # potentially failing on) unrelated lessons.
      - name: Check links and placeholders
        id: linkcheck
        if: always()
        run: |
          set -o pipefail
          if [ -s changed_lessons.txt ]; then
            xargs -a changed_lessons.txt python scripts/check_links.py 2>&1 | tee -a build.log
          else
            echo "check_links: no changed lesson files to check." | tee -a build.log
          fi

      - name: Determine overall outcome
        id: outcome
        if: always()
        run: |
          result=success
          if [ "${{ steps.build.outcome }}" = "failure" ]; then result=failure; fi
          if [ "${{ steps.linkcheck.outcome }}" = "failure" ]; then result=failure; fi
          if [ "${{ steps.location.outputs.location_failed }}" = "true" ]; then result=failure; fi
          echo "result=$result" >> "$GITHUB_OUTPUT"

      # pr_number.txt is only a last-resort hint for pr-comment.yml. It is
      # written by this untrusted job, so that workflow verifies it against the
      # run's head SHA before trusting it.
      - name: Format PR comment
        if: always()
        run: |
          python scripts/format_pr_comment.py "${{ steps.outcome.outputs.result }}" build.log pr_comment.md
          echo "${{ github.event.pull_request.number }}" > pr_number.txt

      - name: Upload the comment for pr-comment.yml to post
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-check-comment
          path: |
            pr_comment.md
            pr_number.txt
          retention-days: 1
          if-no-files-found: error

      - name: Fail the check if anything failed
        if: steps.outcome.outputs.result == 'failure'
        run: exit 1
