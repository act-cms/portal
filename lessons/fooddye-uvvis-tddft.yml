# BASIC METADATA (REQUIRED)
title: "Computational UV-vis Spectroscopy of Food Dyes"

description: "Use TDDFT in Turbomole/TmoleX on an HPC cluster to predict the UV-vis spectra and colors of three candidate molecules and identify which one is the Red-40 dye by comparison to experiment."

expanded_description: |
  Food dyes are colored because they absorb specific wavelengths of visible
  light. In this lesson students use time-dependent density functional theory
  (TDDFT) in the Turbomole program, driven through the TmoleX GUI and run on a
  high-performance computing (HPC) cluster, to predict the UV-vis spectra and
  colors of three candidate structures (A, B, C) and decide which one is the
  Red-40 (Allura Red) dye, whose absorption maximum in aqueous solution lies
  near 504 nm.

  Along the way students set up a realistic solution-phase calculation: a
  def2-TZVPD basis set, a molecular charge of -2, and COSMO
  implicit solvation for water. They submit the job to a cluster queue through
  Open OnDemand, compute the spectrum and predicted color, and compare against
  experimental reference data. The lesson mirrors how chemists screen candidate
  molecules computationally before committing to synthesis, and connects the
  size of a π-conjugated system to absorption wavelengths. It can be paired
  with instructor chosen wet-lab components such as quantitative analysis via
  Beer's law. No programming is required and the workflow is entirely GUI-based.

