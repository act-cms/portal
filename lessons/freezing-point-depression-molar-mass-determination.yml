# BASIC METADATA (REQUIRED)
# Use a clear, descriptive title that includes the main topic
title: "Numerical Analysis of Cooling Curves to Determine the Molar Mass of an Unknown Compound"

# Brief description for search results (1-2 sentences)
description: "Students will interpret thermodynamic data through interactive visualization and numerical analysis of cooling curves to determine the molar mass of an unknown solute"

# Longer description for the lesson page (use | for multi-line text)
expanded_description: |
  This module emphasizes the computational interpretation of noisy, time-resolved thermodynamic data through interactive visualization and numerical analysis of cooling curves. Students analyze temperature vs. time data collected during the freezing of pure solvent and solution samples to determine the freezing point depression and calculate the molar mass of an unknown solute. Unlike traditional implementations of the experiment that rely primarily on manual inspection of cooling curves, this module introduces students to computational approaches for identifying thermodynamically meaningful transition regions in experimental datasets using numerical differentiation.
  Emphasis is placed on the relationship between smoothing and numerical differentiation for this module. Students compare the rolling average and Savitzky-Golay smoothing methods to examine how different approaches influence derivative behavior and identify characteristic regions within the cooling curves. 
