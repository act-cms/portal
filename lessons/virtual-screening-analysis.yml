# BASIC METADATA (REQUIRED)
# Use a clear, descriptive title that includes the main topic
title: "SubscoresScatterPlot to Analyze Virtual Screening Scores on ChemCompute"

# Brief description for search results (1-2 sentences)
description: "Students will learn how to use a Jupyter notebook to generate scatter plots with best fit lines to analyze the 
 sub-score contributions to the overall score for molecular docking data of small molecule into a protein active site. They will use Chemcompute to run the 
 notebook and become familiar with the environment."

# Longer description for the lesson page (use | for multi-line text)
expanded_description: |
  The goal of this lesson is to have students use a Jupyter notebook and Chemcompute. 
  This can serve as a first point of use for these resources and requires no adjustment to nor generation of code. 
  They will use their existing data (from Virtual Screening 1 lab with docking scores and compound names). If no existing data, 
  a sample data set (bestranking.lst) is provided in the repository with ovrall scores and sub-scores from GOLD (the docking program). 
  Students using this lesson are first and second year undergraduates in a CURE (course based undergraduate research experience).

