public_repo_url: "https://github.com/act-cms/GenChem-Modeling-with-Colab"

# MATERIALS SECTION (REQUIRED)
# List each notebook/material in logical order
materials:
  - title: "Lesson 1: Introduction to Google Colab, Python, and Gemini"
    description: "This lesson introduces students to Google Colab, Gemini, and Python as tools for analyzing and visualizing data related to the Ideal Gas Law ."
    type: "notebook"  # Usually "notebook", could be "slides", "dataset", etc.
    duration: "75 minutes"
    
    # REQUIRED: Include at least one URL (preferably both)
    # Direct link to notebook file on GitHub
    github_url: "https://github.com/act-cms/GenChem-Modeling-with-Colab/blob/main/01_Intro-Gas-Laws/Intro-student.ipynb"

    # Google Colab launch link (recommended for accessibility)
    # colab_url: "https://colab.research.google.com/github/act-cms/your-lesson-repo/blob/main/colab-notebooks/01-intro.ipynb"
    
    # Learning objectives specific to this material
    objectives:
      - "Analyze how volume changes with temperature from a data table."
      - "Construct a volume vs. temperature graph and interpret the meaning of the slope and intercepts."
      - "Derive the mathematical relationship from the graph and data."
      - "Describe the relationship between volume and temperature and connect it to the Ideal Gas Law, PV = nRT."
  
  - title: "Lesson 2: Reaction Kinetics of Organic Reactions"
    description: "In this lesson, students use Google Colab, Gemini, and Python to read, analyze, and visualize kinetics data for organic reactions."
    type: "notebook"
    duration: "75 min"
    github_url: "https://github.com/act-cms/GenChem-Modeling-with-Colab/blob/main/02_Reaction-Kinetics/Reaction-order-student.ipynb"
    objectives:
      - "Represent concentration data in tables and graphs."
      - "Predict half-life for 1st- and 2nd-order reactions."
      - "Model and compare 1st- and 2nd-order rate laws using Python."
      - "Use models to identify reaction order by matching theoretical and experimental data."

  - title: "Lesson 3: Reaction Kinetics of Drug Degradation"
    description: "In this lesson, students use Google Colab, Gemini, and Python to read, analyze, and visualize kinetics data for drug degradation in aqueous solutions"
    type: "notebook"
    duration: "75 min"
    github_url: "https://github.com/act-cms/GenChem-Modeling-with-Colab/blob/main/03_Drug-Degradation/Activation-energy-student.ipynb"
    objectives:
      - "Interpret and compare rate constants across temperatures and pHs values."
      - "Model k vs. T and lnk vs. 1/T at different pHs."
      - "Relate slopes and y-intercept to activation energies Ea and frequency factor A."

  - title: "Lesson 4: Titration Curves of Common Household Acids"
    description: "In this lesson, students use Google Colab, Gemini, and Python to read, analyze, and visualize titration data of common household acids with a strong base."
    type: "notebook"
    duration: "75 min"
    github_url: "https://github.com/act-cms/GenChem-Modeling-with-Colab/blob/main/04_Titration-Curves/Titration-student.ipynb"
    objectives:
      - "Identify key features of titration curves (buffer region, half-equivalence point, equivalence point) for weak acids."
      - "Compare titration curves of polyprotic vs monoprotic acids, and match unknowns to reference curves."
      - "Use curve shape and equivalence behavior to determine 𝑝𝐾𝑎 and identify an unknown acid."

  - title: "Lesson 5: Impact of Concentrations on Voltaic Cell Potentials"
    description: "In this lesson, students use Google Colab, Gemini, and Python to read, analyze, and visualize data for a voltaic cell under different conditions."
    type: "notebook"
    duration: "75 min"
    github_url: "https://github.com/act-cms/GenChem-Modeling-with-Colab/blob/main/05_Voltaic-Cells/Cellpotential-student.ipynb"
    objectives:
      - "Interpret how concentration changes influence cell potential."
      - "Graph Ecell vs. concentrations, Q, or log⁡Q to identify trends."
      - "Use Ecell vs. log⁡Q to determine n, Ecell standard, and K, and compare with theoretical predictions."

# LEARNING OBJECTIVES (REQUIRED)
# What molecular science concepts will students learn?
scientific_objectives:
  - "Interpret, analyze, and visualize data in chemical systems, including reaction kinetics, acid-base equilibria, and electrochemical cells."
  - "Relate multiple representations of chemical information (data tables, graphs, equations, and models) to explain and predict chemical behavior."
  - "Develop, apply, and evaluate mathematical models to explain chemical behavior."
  - "Compare experimental results with theoretical predictions to draw evidence-based conclusions."


# What computational/programming skills will students develop?
cyberinfrastructure_objectives:
  - "Access and open a notebook in Google Colab"
  - "Identify and use the key components of the Google Colab interface (code cells, text cells, run button)."
  - "Read and understand a Python script with comments."
  - "Run a Python script and interpret its output."
  - "Data Handling: Import and load a CSV file into a Pandas DataFrame."
  - "Data Cleaning/Transformation: Calculate chemical quantities using mathematical models."
  - "Data Visualization: Generate scatter plots using Python libraries (e.g., Pandas, Matplotlib, NumPy/SciPy)."
  - "Computational Analysis: Perform a linear fit to find the slope and intercept."
  - "AI Literacy: Formulate effective and specific prompts to get the most out of an AI assistant."


