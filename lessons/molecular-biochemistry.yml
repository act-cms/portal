#
# ACT-CMS portal submission for the Molecular Biochemistry module collection.
#
# Items marked "FILL IN" below are the only things that cannot be derived from
# the notebooks themselves: the public repository URL, the instructor contact
# address, and the pilot-cohort size. Everything else is taken from the
# notebooks in this directory.

# ---------------------------------------------------------------------------
# BASIC METADATA
# ---------------------------------------------------------------------------
title: "Molecular Biochemistry: Computational Structural Biology of Enzymes and Designed Proteins"

description: "A nine-notebook collection that takes students from parsing a raw PDB coordinate file to simulating, docking against, and designing binders for a plastic-degrading enzyme, using Python in Google Colab."

expanded_description: |
  This collection teaches molecular biochemistry the way it is now practised:
  as a computational discipline in which sequence, structure, thermodynamics
  and kinetics are all things a student can measure for themselves from
  primary data.

  Every notebook follows a single running system, the polyethylene
  terephthalate hydrolase (PETase) of *Ideonella sakaiensis* (PDB 6ANE), with
  a parallel nucleic-acid thread based on a bacterial purine riboswitch
  aptamer. Because the same enzyme reappears in all nine notebooks, students
  accumulate biochemical intuition about one real protein rather than meeting
  nine disconnected toy systems. The catalytic triad they first locate by
  hand in a text file in the opening notebook becomes the pocket they centre
  a docking box on, the residues whose fluctuations they measure in a
  molecular dynamics trajectory, and the site whose predicted coordinates
  they validate against the crystal structure.

  The collection moves through four stages. Students begin with the raw data
  of structural biochemistry: shell pipelines over PDB records, Python data
  structures for multi-chain assemblies, Henderson-Hasselbalch titration of a
  real protein, and programmatic queries to UniProt, RCSB and NCBI. They then
  quantify function, fitting Michaelis-Menten parameters to PETase kinetics
  by non-linear least squares and distinguishing competitive from
  non-competitive inhibition by global fitting across multiple inhibitor
  concentrations. Next comes molecular mechanics: decomposing a classical
  force field term by term, writing a steepest-descent minimizer from
  scratch, building a solvated and charge-neutralized simulation cell in
  OpenMM, running equilibration, and extracting RMSD, RMSF and radius of
  gyration from the resulting trajectory. The collection closes with
  structure-based drug discovery and protein design: ligand preparation in
  RDKit, scoring-function thermodynamics, virtual-screening performance
  metrics, the mathematics of the AlphaFold2 Evoformer and Invariant Point
  Attention, and a GPU-based peptide binder hallucination run.

  The notebooks are written for students who have seen a Python loop but have
  never used a terminal, and each one builds the physical and statistical
  background it needs before using it. Mathematics is stated explicitly and
  every symbol is named, so the notebooks can also be read by students who
  want the derivation rather than the recipe.

