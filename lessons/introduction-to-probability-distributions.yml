# Free-form notes for instructors
instructor_notes: |
  Additional context for instructors using this lesson:
  
  - This lesson works well when paired with a traditional lecture on probability distributions
  - Students may struggle with user-defined functions and lambda expressions - allow extra time for questions
  - Consider assigning Self-Check 4 and Self-Check 7 as homework rather than in-class work (depending on class session time)
  
  Timing notes:
  - The activity was piloted across two 75-minute class sessions
  - The activity could work as a full 3 hour lab, or could be modified to fit into two 50 min sessions depending on how much detail the instructor explains.
  
  Common student questions:
  - "What does speed mean?" - they are unsure about how to interpret the argument names in python functions
  - "What happens if we change the temperature?" - this connects well to thermodynamics concepts
  - "How is this related to quantum mechanics" - the modulus square of the wavefunction is a probability distribution function

