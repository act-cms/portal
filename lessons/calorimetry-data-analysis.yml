# BASIC METADATA (REQUIRED)
# Use a clear, descriptive title that includes the main topic
title: "Calorimetry: Determining Reaction Enthalpies via Analyzing Thermograms"

# Brief description for search results (1-2 sentences)
description: "Students will learn how to analyze calorimetry thermograms and compute reaction enthalpies."

# Longer description for the lesson page (use | for multi-line text)
expanded_description: |
  The notebook guides students through the analysis of experimental calorimetry data using temperature-time thermograms, emphasizing data ingestion, visualization, and model-based interpretation. Students implement multiple approaches for determining ΔT to account for heat exchange with the surroundings, enabling comparison of analytical methods and discussion of experimental assumptions. Using standard scientific Python libraries (NumPy, SciPy, Pandas, and Matplotlib), 
  students calculate heat flow and reaction enthalpies and propagate experimental uncertainty.
  Embedded reflection questions and scaffolded code cells support students with little or no prior programming experience while reinforcing core thermochemistry concepts. 
  This notebook aesthetics are designed around a solution calorimetry experiment to determine the heat of neutralization of HCl and NaOH, but any calorimetric experiment that outputs a thermogram can use this analysis notebook with custom data.

