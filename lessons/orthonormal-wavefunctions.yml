# BASIC METADATA (REQUIRED)
# Use a clear, descriptive title that includes the main topic
title: "Orthonormal Wavefunctions"

# Brief description for search results (1-2 sentences)
description: "Students will explore orthonormality and normalization of basis sets and superposition wavefunctions."

# Longer description for the lesson page (use | for multi-line text)
expanded_description: |
  In this lesson, students will calculate inner products, plot the products of wavefunctions, 
  and interpret how coefficients and normalization constants impact the amplitude of the wavefunction. 
  This activity reviews material students are familiar with from lecture, but often have a hard 
  time visualizing and understanding. Students normalize a set of orthogonal functions and 
  then use that set to create a superposition wavefunction, compare "good" and "bad" 
  superposition wavefunctions, and normalize the "bad" wavefunction. Students visualize 
  and interpret how coefficients and normalization constants scale the wavefunction amplitude. 
  This activity is useful in a Physical Chemistry - Quantum course. 
  It was piloted over two 75-minute class sessions. 

