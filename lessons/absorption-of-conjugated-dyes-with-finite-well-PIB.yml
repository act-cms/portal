# BASIC METADATA (REQUIRED)
# Use a clear, descriptive title that includes the main topic
title: "Absorption of Conjugated Dyes using the Finite Well Particle-in-a-Box Model"

# Brief description for search results (1-2 sentences)
description: "Use the particle-in-a-finite-well model to explore the absorption of conjugated dyes with UV-vis spectroscopy"

# Longer description for the lesson page (use | for multi-line text)
expanded_description: |
  The particle-in-a-box (PIB) model is a quintessential yet abstract concept for Physical Chemistry. 
  Students often find the model hard to understand due to the mathematical complexity of the model and the limited perceived relevance. 
  Traditionally, students probe the PIB model by measuring the UV-vis absorption of conjugated carbocyanine dyes. 
  This experiment links chain length to π-π* transition energies via an analytical formula in comparison to experimental spectra. 
  To deepen engagement and conceptual understanding, an updated version of the experiment integrates computational chemistry with classic laboratory techniques. 
  Students can connect molecular orbital theory to the restriction of electron motion to discrete energy levels by comparing the computationally determined $λ_{max}$ to the experimentally collected spectra. 
  Additionally, the use of Python introduces valuable skills in coding, data analysis, and visualization. 
  Together, these elements create a multifaceted learning experience that reinforces core physical chemistry concepts through modern computational tools.
  This module was adapted from the following publication: Patel, P. Modernizing Physical Chemistry: Integrating Computational Chemistry, the Finite Well, and Python Data Visualization in the Particle-in-a-Box Experiment. In *Engaging Students in Physical Chemistry, Volume 2; ACS Symposium Series*; American Chemical Society, **2025**; Vol. 1515, pp 261–278. https://doi.org/doi:10.1021/bk-2025-1515.ch017.

