# Free-form notes for instructors
instructor_notes: |
  Additional context for instructors using this lesson:
  
  - Students collected experimental and computational data the prior week in lab and part of their experimental procedure was to analyze the MOs. Therefore in Part 2, section 2 is adaptable as an interactive representation of that process.
  - The time-dependent DFT (TDDFT) spectra were run using ORCA 6.0+ using RIJCOSX CAM-B3LYP/def2-SVP.
  - Students struggle with implementing loops and constructing functions.
  - The visualization exercises are very engaging - allow extra time for exploration and play. The connections will probably not be obvious how the molecular orbitals are similar to the PIB wavefunctions.
  - Sample data is provided to use the notebook. Any custom data should be formatted in the same way as the sample data for best compatibility.
  - Questions/Answers were not graded as these questions can be folded into the lab report.
  - Part 1 can be graded largely on completion as a pre-lab assignment while Part 2 is designed as formative assessment where answers are formally graded in the lab report.
  - The instructor version works in both ChemCompute and Colab; however, the version in Colab will not render the markdown JupyterMyST colored cells.
  
  Timing notes:
  - Part 1 typically takes students 30-60 minutes.
  - Part 2 is better with 3 hours.
  
  Common student questions:
  - "How do we determine the box length?" We measure the distance between the N atoms in the conjugated system
  - "How do we determine the well depth?" The well depth is approximated as the difference in energy levels with no nodes in the conjugated pi system and LUMO+2.
  - "Why isn't this working?" - good opportunity to remind students of patience that comes with programming

