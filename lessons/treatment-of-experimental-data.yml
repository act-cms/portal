# BASIC METADATA (REQUIRED)
# Use a clear, descriptive title that includes the main topic
title: "Treatment of Experimental Data and Visualizing Uncertainty"

# Brief description for search results (1-2 sentences)
description: "Students will learn how to treat experimental data of gas pressure and volume and approximate uncertainties using various techniques."

# Longer description for the lesson page (use | for multi-line text)
expanded_description: |
  How can you import your data from Excel into Python? How do I choose and create the correct plot? What are different ways to represent experimental uncertainty? What is the extent of data needed for proper calibration?
  This notebook explores various methods to measure and visualize uncertainty through graphical error, best fit line uncertainties, and Monte Carlo sampling of the confidence interval. The sample data provided is air pressure in a closed plastic syringe altering the volume from 20 mL to 10 mL.

