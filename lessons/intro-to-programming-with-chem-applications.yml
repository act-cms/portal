# NOTE: To add this lesson to an ordered learning path (or create a new one),
# edit paths.yml at the repo root — step order is defined there, not here.

# REPOSITORY URLS (REQUIRED)
# Link to the repository containing your public material
public_repo_url: "https://github.com/act-cms/intro-to-programming-with-chem-applications"

# MATERIALS SECTION (REQUIRED)
# List each notebook/material in logical order
materials:
  - title: "Part 1: Introduction"
    description: "The notebooks covers a brief introduction to Python and the basics of a Jupyter notebook with embedded videos"
    type: "notebook"  # Usually "notebook", could be "slides", "dataset", etc.
    duration: "30-60 minutes"
    
    # REQUIRED: Include at least one URL (preferably both)
    # Direct link to notebook file on GitHub
    github_url: "https://github.com/act-cms/intro-to-programming-with-chem-applications/blob/main/01_pre-lab-activity/Student.ipynb"
    # Google Colab launch link (recommended for accessibility)
    colab_url: "https://colab.research.google.com/github/act-cms/intro-to-programming-with-chem-applications/blob/main/colab-notebooks/Intro_PreLab_Assignment-Student.ipynb"
    
    # Learning objectives specific to this material
    objectives:
      - "What is the Python programming language, and what is it used for?"
      - "What are the advantages and disadvantages of using Python?"
      - "What is a Jupyter notebook?"
      - "Describe the Python programming language and its uses."
      - "Learn the basics of the Jupyter notebook."
  
  # Add more materials as needed
  - title: "Part 2: Transitioning from Excel to Python for Chemistry Lab Data Analysis"
    description: "Learn and use pandas to explore different chemical applications like calibration curves, IR spectroscopy, and kinetics"
    type: "notebook"
    duration: "1-2 hours"
    github_url: "https://github.com/act-cms/intro-to-programming-with-chem-applications/blob/main/02_intro-activity/Student.ipynb"
    colab_url: "https://colab.research.google.com/github/act-cms/intro-to-programming-with-chem-applications/blob/main/colab-notebooks/02_introduction_to_python-Student.ipynb"
    objectives:
      - "Learn how to import Excel data into Google Colab and into Jupyter Notebooks."
      - "Learn the basics of plotting using Matplotlib."
      - "Apply chemistry knowledge to plots created in Matplotlib."

# LEARNING OBJECTIVES (REQUIRED)
# What molecular science concepts will students learn?
scientific_objectives:
  - "Construct a calibration curve using linear regression."
  - "Interpret IR spectroscopic data to investigate the C=O peak."
  - "Determine the reaction order of experimental kinetic data using integrated rate laws."

# What computational/programming skills will students develop?
cyberinfrastructure_objectives:
  - "Import your Excel data with the pd.read_csv() or the pd.read_excel() function."
  - "Construct numerous types of plots with matplotlib."
  - "There is a high degree of customizability in matplotlib plots."
  - "The scipy.stats.linregress() function computes best fit line parameters."
  - "There are plenty of applications to use Python to model chemical data."

