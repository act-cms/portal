# REPOSITORY URLS (REQUIRED)
# Link to the repository containing your public material
public_repo_url: "https://github.com/act-cms/foundational-symbolic-math"

# MATERIALS SECTION (REQUIRED)
# List each notebook/material in logical order
materials:
  - title: "Lesson 1: Introduction to Symbolic Algebra in Python"
    description: "Introduces students to the foundational skills of using SymPy for symbolic algebra manipulations to solve chemical problems."
    type: "notebook"  # Usually "notebook", could be "slides", "dataset", etc.
    duration: "2-3 hours"
    
    # REQUIRED: Include at least one URL (preferably both)
    # Direct link to notebook file on GitHub
    github_url: "https://github.com/act-cms/foundational-symbolic-math/blob/main/1_symbolic-algebra/student-async.ipynb"
    
    # Learning objectives specific to this material
    objectives:
      - "Define mathematical variables and expressions using SymPy"
      - "Manipulate algebraic expressions to solve for a single variable"
      - "Substitute numerical values and units into algebraic expressions"
      - "Apply symbolic algebra techniques in Python to solve general chemistry problems"
  - title: "Lesson 2: Essentials of Calculus in Python"
    description: "Introduces students to the essential skills for performing calculus operations in Python."
    type: "notebook"  # Usually "notebook", could be "slides", "dataset", etc.
    duration: "3-4 hours"
    
    # REQUIRED: Include at least one URL (preferably both)
    # Direct link to notebook file on GitHub
    github_url: "https://github.com/act-cms/foundational-symbolic-math/blob/main/2_symbolic-calculus/student-async.ipynb"
    
    # Learning objectives specific to this material
    objectives:
      - "Encode mathematical functions of one or more variables into SymPy expressions"
      - "Perform symbolic derivatives of scalar functions of one or more variables in SymPy"
      - "Perform symbolic indefinite integration of scalar functions of one or more variables in SymPy"
      - "Perform symbolic definite integration of scalar functions of one or more variables in SymPy"
      - "Perform numerical quadrature to evaluate definite integrals of one or more variables with SciPy"
  
# LEARNING OBJECTIVES (REQUIRED)
# What molecular science concepts will students learn?
scientific_objectives:
  - "Define mathematical variables and expressions using SymPy"
  - "Manipulate algebraic expressions to solve for a single variable"
  - "Substitute numerical values and units into algebraic expressions"
  - "Apply symbolic algebra techniques in Python to solve general chemistry problems"
  - "Perform symbolic calculus operations using the SymPy library"
  - "Perform numerical quadrature for definite integration using the SciPy library"

# What computational/programming skills will students develop?
cyberinfrastructure_objectives:
  - "Using SymPy to symbolically perform mathematical transformations in a chemical context"
  - "Using NumPy/SciPy to perform numerical mathematics operations"
  - "Using SymPy/SciPy to perform symbolic and numerical calculus operations in Python"

