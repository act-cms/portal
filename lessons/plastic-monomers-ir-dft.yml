# BASIC METADATA (REQUIRED)
title: "Computational IR Spectroscopy of Plastic Monomers"

description: "Use DFT in Turbomole/TmoleX on an HPC cluster to compute the IR spectra of two candidate monomers and identify which one an unknown plastic is made from."

expanded_description: |
  In this lesson students use density functional theory (DFT) in the Turbomole program, 
  used through the TmoleX GUI, to compute the IR spectra of two candidate monomer 
  structures and decide which one an unknown plastic is built from by comparing with 
  the experimental spectrum of the unknown measured in the wet-lab part
  (which shows a distinct band near 1700 cm⁻¹).

  Students build each monomer themselves with the 2D editor and convert it to
  3D, run a DFT geometry optimization, then a harmonic vibrational-frequency
  calculation from the optimized geometry. They read off vibrational frequencies
  and IR intensities, animate and characterize the normal modes behind the
  strongest bands, and connect the diagnostic ~1700 cm⁻¹ carbonyl band to the
  presence of an ester group. The jobs are small and run locally inside the GUI
  session (no programming component).

